services:
  - type: web
    name: equiptra-api
    runtime: go
    rootDir: backend
    buildCommand: go build -o bin/api ./cmd/api
    startCommand: ./bin/api
    healthCheckPath: /healthz
    envVars:
      # Set for real once the pieces are ready — Render will prompt for any
      # var below without a value when you create the service from this blueprint.
      - key: DATABASE_URL
        sync: false # Supabase Postgres connection string
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://equiptra-smoky.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: S3_BUCKET
        sync: false
      - key: AWS_REGION
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false # Supabase Storage's S3-compatible endpoint
      - key: S3_PUBLIC_BASE_URL
        sync: false # Supabase Storage's public object URL base
      - key: AWS_ACCESS_KEY_ID
        sync: false # Supabase Storage S3 access key (not an AWS account)
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
